[project]
name = "adaptive-workflow-local-benchmark"
version = "0.19.4"
description = "Resource-bounded local benchmark for Adaptive Workflow routing"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "psutil>=6.1,<8",
    "pywin32>=311; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
adaptive-workflow-benchmark = "agents.adaptive_workflow.benchmark.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
